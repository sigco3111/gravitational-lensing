<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pageTitle">중력 렌즈 — 슈바르츠실트 블랙홀</title>
<style>
  :root {
    --accent: #aaccff;
    --accent-bright: #ffffff;
    --panel-bg: rgba(8, 12, 22, 0.55);
    --panel-border: rgba(170, 200, 255, 0.18);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
    color: var(--accent);
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: grab;
    touch-action: none;
  }
  canvas:active { cursor: grabbing; }

  .panel {
    position: fixed;
    background: var(--panel-bg);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 12px;
    line-height: 1.5;
    pointer-events: auto;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    user-select: none;
  }

  #info {
    top: 18px;
    left: 18px;
    min-width: 280px;
  }
  #info h1 {
    margin: 0 0 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--accent-bright);
    letter-spacing: 0.3px;
  }
  #info .formula {
    font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--accent);
    opacity: 0.85;
    margin: 4px 0;
  }
  #info .row {
    display: flex;
    justify-content: space-between;
    margin: 3px 0;
  }
  #info .label { opacity: 0.75; }
  #info .value {
    color: var(--accent-bright);
    font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    font-weight: 500;
  }

  #controls {
    bottom: 18px;
    left: 18px;
    min-width: 300px;
  }
  #controls .ctrl { margin: 10px 0; }
  #controls .ctrl-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
    font-size: 11px;
    color: var(--accent-bright);
  }
  #controls .ctrl-label .name { font-weight: 500; letter-spacing: 0.2px; }
  #controls .ctrl-label .val {
    font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    color: var(--accent);
    font-size: 12px;
  }
  #controls input[type="range"] {
    width: 100%;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(170, 200, 255, 0.18);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  #controls input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    background: var(--accent-bright);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(170, 200, 255, 0.6);
  }
  #controls input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    background: var(--accent-bright);
    border-radius: 50%;
    cursor: pointer;
    border: none;
    box-shadow: 0 0 8px rgba(170, 200, 255, 0.6);
  }

  #legend {
    bottom: 18px;
    right: 18px;
    font-size: 11px;
    pointer-events: none;
    max-width: 240px;
  }
  #legend .hint { margin: 3px 0; opacity: 0.85; }
  #legend .key {
    display: inline-block;
    min-width: 28px;
    padding: 1px 6px;
    background: rgba(170, 200, 255, 0.12);
    border: 1px solid rgba(170, 200, 255, 0.25);
    border-radius: 4px;
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    margin-right: 6px;
    text-align: center;
    color: var(--accent-bright);
  }

  #langToggle {
    top: 18px;
    right: 18px;
    padding: 6px 6px;
    display: flex;
    gap: 4px;
    pointer-events: auto;
  }
  .lang-btn {
    background: transparent;
    border: 1px solid rgba(170, 200, 255, 0.18);
    color: var(--accent);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    min-width: 36px;
    line-height: 1;
    letter-spacing: 0.3px;
  }
  .lang-btn:hover {
    background: rgba(170, 200, 255, 0.10);
    color: var(--accent-bright);
  }
  .lang-btn.active {
    background: rgba(170, 200, 255, 0.22);
    color: var(--accent-bright);
    border-color: rgba(170, 200, 255, 0.45);
    box-shadow: inset 0 0 0 1px rgba(170, 200, 255, 0.20);
  }

  #error {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(60, 0, 0, 0.92);
    border: 1px solid #ff4444;
    color: #ffaaaa;
    padding: 20px 30px;
    border-radius: 8px;
    font-family: monospace;
    font-size: 13px;
    max-width: 80%;
    display: none;
    z-index: 100;
    white-space: pre-wrap;
  }
</style>
</head>

<canvas id="canvas"></canvas>

<div id="info" class="panel">
  <h1 data-i18n="infoTitle">슈바르츠실트 블랙홀</h1>
  <div class="formula">α(b) ≈ 2 r<sub>s</sub> / √(b² − b<sub>c</sub>²)</div>
  <div class="row"><span class="label" data-i18n="rsLabel">r<sub>s</sub> (이벤트 지평선)</span><span class="value" id="rsInfo">0.50</span></div>
  <div class="row"><span class="label" data-i18n="bcLabel">b<sub>c</sub> (광자 포획)</span><span class="value" id="bcInfo">1.30</span></div>
  <div class="row"><span class="label" data-i18n="shadowLabel">그림자 각크기</span><span class="value" id="shadowInfo">28.7°</span></div>
  <div class="row"><span class="label" data-i18n="fpsLabel">FPS</span><span class="value" id="fpsInfo">—</span></div>
</div>

<div id="controls" class="panel">
  <div class="ctrl">
    <div class="ctrl-label">
      <span class="name" data-i18n="rsSliderName">슈바르츠실트 반경 (r<sub>s</sub>)</span>

    <div class="ctrl-label">
      <span class="name" data-i18n="starSliderName">별 밀도</span>

    <input type="range" id="starSlider" min="20" max="300" step="5" value="120">
  </div>
  <div class="ctrl">
    <div class="ctrl-label">
      <span class="name" data-i18n="lensSliderName">렌즈 강도</span>
      <span class="val" id="lensVal">1.00×</span>

    <input type="range" id="lensSlider" min="0" max="3" step="0.05" value="1.0">

</div>

<script type="module">
import * as THREE from 'three';

// ────────────────────────────────────────────────────────────────────────────
//  Constants & State
// ────────────────────────────────────────────────────────────────────────────

const BH_CENTER = new THREE.Vector3(0, 0, 0);
// Critical impact parameter for Schwarzschild photon capture: bc = (3√3/2)·rs
const CRITICAL_IMPACT_FACTOR = (3.0 * Math.sqrt(3.0)) / 2.0;  // ≈ 2.598076211

// ────────────────────────── i18n ──────────────────────────
// Translation strings for ko (default) and en.
// `innerHTML` is safe here because the values are author-controlled
// and never derived from user input.
const i18n = {
  ko: {
    pageTitle:         '중력 렌즈 — 슈바르츠실트 블랙홀',
    infoTitle:         '슈바르츠실트 블랙홀',
    rsLabel:           'r<sub>s</sub> (이벤트 지평선)',
    bcLabel:           'b<sub>c</sub> (광자 포획)',
    shadowLabel:       '그림자 각크기',
    fpsLabel:          'FPS',
    rsSliderName:      '슈바르츠실트 반경 (r<sub>s</sub>)',
    distSliderName:    '카메라 거리',
    starSliderName:    '별 밀도',
    lensSliderName:    '렌즈 강도',
    hintDragKey:       '드래그',
    hintDragAction:    '카메라 궤도',
    hintScrollKey:     '스크롤',
    hintScrollAction:  '줌 인/아웃',
    hintResetKey:      'R',
    hintResetAction:   '시점 리셋',
  },
  en: {
    pageTitle:         'Gravitational Lensing — Schwarzschild Black Hole',
    infoTitle:         'Schwarzschild Black Hole',
    rsLabel:           'r<sub>s</sub> (event horizon)',
    bcLabel:           'b<sub>c</sub> (photon capture)',
    shadowLabel:       'shadow angular size',
    fpsLabel:          'FPS',
    rsSliderName:      'Schwarzschild Radius (r<sub>s</sub>)',
    distSliderName:    'Camera Distance',
    starSliderName:    'Star Density',
    lensSliderName:    'Lensing Strength',
    hintDragKey:       'drag',
    hintDragAction:    'orbit camera',
    hintScrollKey:     'scroll',
    hintScrollAction:  'zoom in/out',
    hintResetKey:      'R',
    hintResetAction:   'reset view',
  },
};

// Default = Korean; user's choice is persisted in localStorage.
const LANG_STORAGE_KEY = 'grav-lens-lang';
let currentLang = (() => {
  try {
    const stored = localStorage.getItem(LANG_STORAGE_KEY);
    if (stored === 'ko' || stored === 'en') return stored;
  } catch (_) { /* localStorage may be blocked */ }
  return 'ko';
})();

function setLanguage(lang) {
  if (!i18n[lang]) lang = 'ko';
  currentLang = lang;
  try { localStorage.setItem(LANG_STORAGE_KEY, lang); } catch (_) {}

  document.documentElement.lang = (lang === 'ko') ? 'ko' : 'en';
  document.title = i18n[lang].pageTitle;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (i18n[lang][key] !== undefined) {
      el.innerHTML = i18n[lang][key];
    }
  });

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
}

const state = {
  rs: 0.5,
  cameraDistance: 5.0,
  starDensity: 120.0,
  lensingStrength: 1.0,
  cameraTheta: 0.3,
  cameraPhi: 0.25,
  isDragging: false,
  lastMouseX: 0,
  lastMouseY: 0,
};

// ────────────────────────────────────────────────────────────────────────────
//  Renderer / Scene / Camera
// ────────────────────────────────────────────────────────────────────────────

const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: 'high-performance',
  preserveDrawingBuffer: false,
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 1);

const camera = new THREE.PerspectiveCamera(
  72,
  window.innerWidth / window.innerHeight,
  0.01,
  1000
);

// ────────────────────────────────────────────────────────────────────────────
//  Shaders
// ────────────────────────────────────────────────────────────────────────────

const vertexShader = /* glsl */ `
  uniform vec3 uCameraForward;
  uniform vec3 uCameraRight;
  uniform vec3 uCameraUp;
  uniform float uTanHalfFov;
  uniform float uAspect;

  varying vec3 vRayDir;

  void main() {
    // PlaneGeometry(2,2) → position ∈ [-1, 1]² covers full NDC
    vec3 dir = uCameraForward
             + uCameraRight * position.x * uTanHalfFov * uAspect
             + uCameraUp    * position.y * uTanHalfFov;
    vRayDir = normalize(dir);
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }
`;

// Fragment shader: __BC__ placeholder gets substituted with the constant.
const fragmentShader = /* glsl */ `
  precision highp float;

  uniform float uTime;
  uniform vec2  uResolution;
  uniform vec3  uCameraPos;
  uniform vec3  uBH;
  uniform float uRs;
  uniform float uStarDensity;
  uniform float uLensingStrength;

  varying vec3 vRayDir;

  // ────────────────────────── Hash & Noise ──────────────────────────
  float hash13(vec3 p) {
    p = fract(p * 0.1031);
    p += dot(p, p.yzx + 33.33);
    return fract((p.x + p.y) * p.z);
  }

  // 3D value noise — smooth, sphere-seamless
  float vnoise(vec3 p) {
    vec3 i = floor(p);
    vec3 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);

    return mix(
      mix(
        mix(hash13(i + vec3(0.0,0.0,0.0)), hash13(i + vec3(1.0,0.0,0.0)), f.x),
        mix(hash13(i + vec3(0.0,1.0,0.0)), hash13(i + vec3(1.0,1.0,0.0)), f.x),
        f.y),
      mix(
        mix(hash13(i + vec3(0.0,0.0,1.0)), hash13(i + vec3(1.0,0.0,1.0)), f.x),
        mix(hash13(i + vec3(0.0,1.0,1.0)), hash13(i + vec3(1.0,1.0,1.0)), f.x),
        f.y),
      f.z);
  }

  float fbm(vec3 p) {
    float v = 0.0;
    float a = 0.5;
    for (int i = 0; i < 5; i++) {
      v += a * vnoise(p);
      p *= 2.07;
      a *= 0.5;
    }
    return v;
  }

  // ────────────────────────── Starfield ──────────────────────────
  vec3 starfield(vec3 dir) {
    vec3 d = normalize(dir);

    // 1. Deep-space base
    vec3 bg = vec3(0.0035, 0.0045, 0.012);

    // 2. Galactic plane (Milky Way band)
    vec3 galNormal = normalize(vec3(0.42, 0.18, 0.89));
    float galDot = dot(d, galNormal);
    float band = exp(-galDot * galDot * 2.4);
    vec3 bandColor = mix(
      vec3(0.18, 0.10, 0.28),
      vec3(0.32, 0.18, 0.12),
      0.5 + 0.5 * sin(d.x * 3.0 + d.z * 2.0)
    );
    bg += bandColor * band * 0.85;

    // 3. Nebulae (multi-octave FBM, modulated)
    float n1 = fbm(d * 1.8);
    float n2 = fbm(d * 4.2 + vec3(13.7, 5.1, 29.3));
    float nebulaMask = smoothstep(0.42, 0.78, n1 * 0.65 + n2 * 0.35);
    vec3 nebColorA = vec3(0.22, 0.08, 0.38);  // purple
    vec3 nebColorB = vec3(0.32, 0.10, 0.06);  // crimson
    vec3 nebColorC = vec3(0.05, 0.18, 0.32);  // teal-blue
    float nebMix1 = clamp(fbm(d * 0.9 + 7.3), 0.0, 1.0);
    float nebMix2 = clamp(fbm(d * 0.7 - 4.1), 0.0, 1.0);
    vec3 nebColor = mix(nebColorA, nebColorB, nebMix1);
    nebColor = mix(nebColor, nebColorC, nebMix2 * 0.6);
    bg += nebColor * nebulaMask * 0.55;

    // 4. Stars — sparse Voronoi cells on the sphere
    vec3 sp = d * uStarDensity;
    vec3 cell = floor(sp);
    vec3 f = fract(sp);

    vec3 stars = vec3(0.0);

    for (int z = -1; z <= 1; z++) {
      for (int y = -1; y <= 1; y++) {
        for (int x = -1; x <= 1; x++) {
          vec3 offs = vec3(float(x), float(y), float(z));
          vec3 cp = cell + offs;

          float seed = hash13(cp);
          // Density mask: stars are rarer in low-density regions, denser in high-density
          float densityMask = mix(0.985, 0.94, smoothstep(0.3, 0.7, n1 * 0.7 + n2 * 0.3));

          if (seed > densityMask) {
            float rx = hash13(cp + vec3(1.1, 3.7, 9.2));
            float ry = hash13(cp + vec3(5.3, 2.1, 7.8));
            float rz = hash13(cp + vec3(8.7, 6.5, 1.3));
            vec3 starPos = offs + vec3(rx, ry, rz);

            float dist = length(f - starPos);
            float seed2 = hash13(cp + vec3(17.0, 11.0, 5.0));
            float starSize = mix(0.012, 0.038, seed2 * seed2);
            float brightness = pow((seed - densityMask) / (1.0 - densityMask), 0.55)
                             * (1.5 + seed2 * 4.5);

            vec3 starHue = mix(
              vec3(0.82, 0.90, 1.00),  // blue-white
              vec3(1.00, 0.92, 0.74),  // warm yellow
              hash13(cp + vec3(31.7, 53.1, 71.3))
            );
            // Occasional red giants
            if (hash13(cp + vec3(89.3)) > 0.92) {
              starHue = vec3(1.00, 0.55, 0.40);
              brightness *= 1.8;
              starSize *= 1.4;
            }

            float intensity = smoothstep(starSize, 0.0, dist);
            // Cross-shaped diffraction spike for bright stars
            float spike = 0.0;
            if (brightness > 1.8) {
              float dx = abs(f.x - starPos.x);
              float dy = abs(f.y - starPos.y);
              float dz = abs(f.z - starPos.z);
              spike  = exp(-dx * 80.0) * exp(-dy * 12.0) * 0.6;
              spike += exp(-dy * 80.0) * exp(-dx * 12.0) * 0.6;
              spike += exp(-dz * 80.0) * exp(-dx * 6.0)  * 0.4;
            }
            stars += starHue * (intensity + spike) * brightness;
          }
        }
      }
    }

    return bg + stars;
  }

  // ────────────────────────── Photon Ring ──────────────────────────
  float photonRing(float b, float bc, float rs) {
    float t = (b - bc) / rs;
    float core = exp(-t * t * 800.0);
    float halo = exp(-t * t * 60.0) * 0.35;
    return core + halo;
  }

  // ────────────────────────── Main ──────────────────────────
  void main() {
    vec3 rayDir = normalize(vRayDir);
    vec3 camToBH = uBH - uCameraPos;

    // Lens strength: 0 → no deflection (still shadow), 1 → physical Schwarzschild
    float lensK = clamp(uLensingStrength, 0.0, 4.0);
    float bc = uRs * __BC__;  // shadow size is fixed at physical bc

    // Impact parameter: b² = |camToBH|² - (camToBH · rayDir)²
    float dotCR = dot(camToBH, rayDir);
    float bSq = dot(camToBH, camToBH) - dotCR * dotCR;
    float b = sqrt(max(bSq, 0.0));

    vec3 color;

    if (b < bc) {
      // Event horizon shadow with photon-ring edge — size fixed at physical bc
      float ring = photonRing(b, bc, uRs);
      vec3 ringCol = vec3(1.45, 0.95, 0.55);
      color = ringCol * ring * 0.45;
    } else if (lensK < 0.001) {
      // Lensing disabled: render the starfield without any deflection
      color = starfield(rayDir);
    } else {
      // Strong-field Schwarzschild deflection:
      //   α(b) = 2 rs / √(b² − bc²)
      // Reduces to 2rs/b in the weak-field limit (b >> rs) and diverges at bc,
      // matching the physical logarithmic divergence of the exact integral.
      // lensK scales the deflection: 1.0 = physical, >1 = exaggerated.
      float safeB = max(b, bc + uRs * 0.002);
      float alphaBase = 2.0 * uRs / sqrt(safeB * safeB - bc * bc);
      float alpha = lensK * alphaBase;

      // Rotation axis perpendicular to the (rayDir, camToBH) plane.
      // Rotation takes rayDir toward camToBH_unit, recovering the
      // pre-deflection source direction.
      vec3 camToBH_unit = camToBH / max(length(camToBH), 1e-6);
      vec3 axis = cross(rayDir, camToBH_unit);
      float axisLen = length(axis);
      if (axisLen < 1e-5) {
        axis = normalize(cross(rayDir, vec3(0.0, 1.0, 0.0)));
      } else {
        axis = axis / axisLen;
      }

      // Rodrigues rotation: rotate rayDir by +alpha around axis
      float c = cos(alpha);
      float s = sin(alpha);
      vec3 sourceDir = rayDir * c
                     + cross(axis, rayDir) * s
                     + axis * dot(axis, rayDir) * (1.0 - c);

      vec3 starColor = starfield(sourceDir);

      // Photon ring overlay on the lensed side (asymptotic orbits)
      float ring = photonRing(b, bc, uRs);
      vec3 ringCol = vec3(1.55, 1.05, 0.62);
      starColor += ringCol * ring * 0.85;

      // Subtle chromatic dispersion near the shadow
      float disp = clamp((bc - b + uRs) / (bc + uRs), 0.0, 1.0);
      disp = (1.0 - disp) * 0.18;
      starColor *= vec3(1.0 + disp * 0.35, 1.0, 1.0 - disp * 0.45);

      color = starColor;
    }

    // Reinhard tonemap
    color = color / (1.0 + color);
    // Gamma
    color = pow(color, vec3(1.0 / 2.2));

    gl_FragColor = vec4(color, 1.0);
  }
`;

// Inject the constant value
const FINAL_FRAGMENT_SHADER = fragmentShader.replace(/__BC__/g, CRITICAL_IMPACT_FACTOR.toFixed(8));

// ────────────────────────────────────────────────────────────────────────────
//  Material + Quad
// ────────────────────────────────────────────────────────────────────────────

const material = new THREE.ShaderMaterial({
  uniforms: {
    uTime:             { value: 0 },
    uResolution:       { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    uCameraPos:        { value: new THREE.Vector3() },
    uCameraForward:    { value: new THREE.Vector3() },
    uCameraRight:      { value: new THREE.Vector3() },
    uCameraUp:         { value: new THREE.Vector3() },
    uTanHalfFov:       { value: Math.tan((camera.fov * Math.PI / 180) * 0.5) },
    uAspect:           { value: window.innerWidth / window.innerHeight },
    uBH:               { value: BH_CENTER.clone() },
    uRs:               { value: state.rs },
    uStarDensity:      { value: state.starDensity },
    uLensingStrength:  { value: state.lensingStrength },
  },
  vertexShader,
  fragmentShader: FINAL_FRAGMENT_SHADER,
  depthTest: false,
  depthWrite: false,
});

const quadScene = new THREE.Scene();
const quadCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadGeometry = new THREE.PlaneGeometry(2, 2);
const quad = new THREE.Mesh(quadGeometry, material);
quadScene.add(quad);

// ────────────────────────────────────────────────────────────────────────────
//  Camera Position (orbit around BH)
// ────────────────────────────────────────────────────────────────────────────

function updateCameraPosition() {
  const r = state.cameraDistance;
  const x = r * Math.sin(state.cameraPhi) * Math.cos(state.cameraTheta);
  const y = r * Math.cos(state.cameraPhi);
  const z = r * Math.sin(state.cameraPhi) * Math.sin(state.cameraTheta);
  camera.position.set(x, y, z);
  camera.lookAt(BH_CENTER);
}
updateCameraPosition();

// ────────────────────────────────────────────────────────────────────────────
//  Controls: mouse drag to orbit, wheel to zoom
// ────────────────────────────────────────────────────────────────────────────

canvas.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouseX = e.clientX;
  state.lastMouseY = e.clientY;
});
window.addEventListener('mouseup', () => { state.isDragging = false; });
window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const dx = e.clientX - state.lastMouseX;
  const dy = e.clientY - state.lastMouseY;
  state.lastMouseX = e.clientX;
  state.lastMouseY = e.clientY;
  state.cameraTheta -= dx * 0.005;
  state.cameraPhi   += dy * 0.005;
  state.cameraPhi = Math.max(0.05, Math.min(Math.PI - 0.05, state.cameraPhi));
  updateCameraPosition();
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  state.cameraDistance *= (1.0 + e.deltaY * 0.001);
  state.cameraDistance = Math.max(2.0, Math.min(15.0, state.cameraDistance));
  document.getElementById('distSlider').value = state.cameraDistance.toFixed(1);
  document.getElementById('distVal').textContent = state.cameraDistance.toFixed(1);
  updateCameraPosition();
  updateInfo();
}, { passive: false });

// Touch
let lastTouchX = 0, lastTouchY = 0, pinchStartDist = null;
canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    state.isDragging = true;
    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.hypot(dx, dy);
  }
}, { passive: true });
canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length === 1 && state.isDragging) {
    const dx = e.touches[0].clientX - lastTouchX;
    const dy = e.touches[0].clientY - lastTouchY;
    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;
    state.cameraTheta -= dx * 0.005;
    state.cameraPhi   += dy * 0.005;
    state.cameraPhi = Math.max(0.05, Math.min(Math.PI - 0.05, state.cameraPhi));
    updateCameraPosition();
  } else if (e.touches.length === 2 && pinchStartDist !== null) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const scale = pinchStartDist / dist;
    state.cameraDistance *= scale;
    state.cameraDistance = Math.max(2.0, Math.min(15.0, state.cameraDistance));
    pinchStartDist = dist;
    document.getElementById('distSlider').value = state.cameraDistance.toFixed(1);
    document.getElementById('distVal').textContent = state.cameraDistance.toFixed(1);
    updateCameraPosition();
    updateInfo();
  }
}, { passive: true });
canvas.addEventListener('touchend', () => {
  state.isDragging = false;
  pinchStartDist = null;
});

// Keyboard
window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    state.cameraTheta = 0.3;
    state.cameraPhi = 0.25;
    state.cameraDistance = 5.0;
    state.rs = 0.5;
    state.lensingStrength = 1.0;
    document.getElementById('rsSlider').value = state.rs;
    document.getElementById('rsVal').textContent = state.rs.toFixed(2);
    document.getElementById('distSlider').value = state.cameraDistance.toFixed(1);
    document.getElementById('distVal').textContent = state.cameraDistance.toFixed(1);
    document.getElementById('lensSlider').value = state.lensingStrength;
    document.getElementById('lensVal').textContent = state.lensingStrength.toFixed(2) + '×';
    updateCameraPosition();
    updateInfo();
  }
});

// ────────────────────────────────────────────────────────────────────────────
//  UI Bindings
// ────────────────────────────────────────────────────────────────────────────

function bindSlider(id, valId, callback, format) {
  format = format || ((v) => v.toFixed(2));
  const slider = document.getElementById(id);
  const valSpan = document.getElementById(valId);
  valSpan.textContent = format(parseFloat(slider.value));
  slider.addEventListener('input', () => {
    const v = parseFloat(slider.value);
    valSpan.textContent = format(v);
    callback(v);
  });
}

bindSlider('rsSlider',   'rsVal',   (v) => { state.rs = v; updateInfo(); },                       (v) => v.toFixed(2));
bindSlider('distSlider', 'distVal', (v) => { state.cameraDistance = v; updateCameraPosition(); updateInfo(); }, (v) => v.toFixed(1));
bindSlider('starSlider', 'starVal', (v) => { state.starDensity = v; },                             (v) => v.toFixed(0));
bindSlider('lensSlider', 'lensVal', (v) => { state.lensingStrength = v; },                         (v) => v.toFixed(2) + '×');

// ────────────────────────────────────────────────────────────────────────────
//  Info Panel
// ────────────────────────────────────────────────────────────────────────────

function updateInfo() {
  const bc = state.rs * CRITICAL_IMPACT_FACTOR;
  const shadowAngularDeg = (2 * Math.atan(bc / state.cameraDistance)) * 180 / Math.PI;
  document.getElementById('rsInfo').textContent     = state.rs.toFixed(2);
  document.getElementById('bcInfo').textContent     = bc.toFixed(2);
  document.getElementById('shadowInfo').textContent = shadowAngularDeg.toFixed(1) + '°';
}
updateInfo();

// ────────────────────────────────────────────────────────────────────────────
//  Resize
// ────────────────────────────────────────────────────────────────────────────

function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  material.uniforms.uResolution.value.set(w, h);
  material.uniforms.uAspect.value = w / h;
  material.uniforms.uTanHalfFov.value = Math.tan((camera.fov * Math.PI / 180) * 0.5);
}
window.addEventListener('resize', onResize);
onResize();

// ────────────────────────────────────────────────────────────────────────────
//  Camera basis extraction
// ────────────────────────────────────────────────────────────────────────────

const _forward = new THREE.Vector3();
const _right = new THREE.Vector3();
const _up = new THREE.Vector3();
const _worldUp = new THREE.Vector3(0, 1, 0);

function updateCameraUniforms() {
  camera.getWorldDirection(_forward);
  _right.crossVectors(_forward, _worldUp).normalize();
  _up.crossVectors(_right, _forward).normalize();

  material.uniforms.uCameraPos.value.copy(camera.position);
  material.uniforms.uCameraForward.value.copy(_forward);
  material.uniforms.uCameraRight.value.copy(_right);
  material.uniforms.uCameraUp.value.copy(_up);
  material.uniforms.uRs.value = state.rs;
  material.uniforms.uStarDensity.value = state.starDensity;
  material.uniforms.uLensingStrength.value = state.lensingStrength;
}

// ────────────────────────────────────────────────────────────────────────────
//  Animation Loop
// ────────────────────────────────────────────────────────────────────────────

let lastTime = performance.now();
let fpsAccum = 0;
let fpsFrames = 0;
let fpsLastReport = lastTime;

function animate(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  if (!state.isDragging) {
    state.cameraTheta += dt * 0.04;
    updateCameraPosition();
  }

  updateCameraUniforms();
  material.uniforms.uTime.value = now * 0.001;

  renderer.render(quadScene, quadCamera);

  fpsAccum += dt;
  fpsFrames += 1;
  if (now - fpsLastReport > 500) {
    const fps = fpsFrames / fpsAccum;
    document.getElementById('fpsInfo').textContent = fps.toFixed(0);
    fpsAccum = 0;
    fpsFrames = 0;
    fpsLastReport = now;
  }

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ────────────────────────────────────────────────────────────────────────────
//  Language toggle wiring
// ────────────────────────────────────────────────────────────────────────────

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
});

// Apply initial language BEFORE first paint so users never see EN fallback
// when their preference is Korean.
setLanguage(currentLang);

// ────────────────────────────────────────────────────────────────────────────
//  Error overlay (WebGL/shader failures)
// ────────────────────────────────────────────────────────────────────────────

window.addEventListener('error', (e) => {
  const errEl = document.getElementById('error');
  errEl.textContent = 'Error: ' + (e.message || e.error);
  errEl.style.display = 'block';
});

canvas.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  const errEl = document.getElementById('error');
  errEl.textContent = 'WebGL context lost. Please reload.';
  errEl.style.display = 'block';
});
</script>
</body>
</html>
